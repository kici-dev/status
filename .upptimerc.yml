# KiCI status page configuration — https://status.kici.dev
# Docs for this setup: docs/internal/status-page.md in the myci26 repo.
owner: kici-dev
repo: status

sites:
  # Canonical unauthenticated liveness probe. Everything else on this vhost
  # deliberately 503s; /api/health is a 404 — do not "fix" the path.
  # Webhook ingress (/webhook/*) shares this vhost + pool, so it is covered here.
  - name: Platform API
    url: https://api.kici.dev/health
  # Bunny-CDN-served dashboard SPA.
  - name: Dashboard
    url: https://app.kici.dev
  # Bunny-CDN-served docs.
  - name: Docs
    url: https://docs.kici.dev
  # Keycloak OIDC discovery — clean unauthenticated 200.
  - name: Auth
    url: https://auth.kici.dev/realms/kici-internal/.well-known/openid-configuration

assignees:
  - cmaster11

status-website:
  cname: status.kici.dev
  name: KiCI status
  logoUrl: https://kici.dev/cat-head.svg
  introTitle: '**KiCI status** — live availability of the KiCI platform'
  introMessage: >-
    This page is updated automatically every few minutes by independent external
    probes. Subscribe to updates via the
    [Atom feed](https://github.com/kici-dev/status/commits/master.atom) or by
    watching the [GitHub repository](https://github.com/kici-dev/status)
    (Watch → Custom → Issues) for email notifications.
  navbar:
    - title: Status
      href: /
    - title: kici.dev
      href: https://kici.dev
    - title: Docs
      href: https://docs.kici.dev
